# Per-platform format rules. validate.ts enforces hard limits; Claude follows style notes when drafting.
#
# Scheduling (Muxin, 2026-06-16): anchor posting times to PST, NOT his local CST, because the
# tech/AI audience skews West Coast (SF Bay is a top location). `best_times_pst` is the human-readable
# target window; the machine-readable cadence below it drives automatic scheduling.
#
# CADENCE (Muxin, 2026-06-16): publish:typefully now computes an EXPLICIT publish time per post and
# sends it to Typefully (DST-aware, PT) so posts auto-publish on schedule — no manual dragging. Three
# fields per platform drive it:
#   posts_per_week  — cap on how many posts land on this platform in any Mon-Sun week
#   slot_days       — weekdays eligible for a slot (Sun..Sat); scheduler places ~1/day by default
#   slot_time_pst   — time of day (PST/PDT wall clock) for that day's slot, inside best_times_pst
#   max_slots_per_day — optional; raises the per-day cap above 1, spacing extra slots across the day
# Approved posts fill the next free future slots in queue order, spreading across weeks if there are
# more than posts_per_week. Cross-run + cross-stream spacing IS built: src/publish/slots.ts records
# every claim in a shared ledger (data/publish-schedule.jsonl), so text and cards never exceed a
# platform's per-day slot cap across separate runs. A platform without these three fields falls back
# to Typefully "next-free-slot".
# Minimum days between re-publishing the same content slug to a platform. The per-platform
# values below override this for their channel; anything not listed inherits this default.
# Enforced by the reuse guard in src/publish/reuse-guard.ts (checked by publish:typefully
# and publish:cards before claiming slots).
min_reuse_days: 30

platforms:
  x:
    min_reuse_days: 14      # moves fast; a shorter reuse window is acceptable
    max_chars: 280
    derivative_count: [3, 5]
    best_times_pst: "Tue-Thu, 9-11am (primary), 1-2pm (secondary). Weaker on weekends, but posting keeps presence."
    posts_per_week: 7      # bumped 5->7 (Muxin, 2026-07-07); max under x's current 1-post/PT-day cadence
    slot_days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]   # weekends allowed; weekly cap still limits volume
    slot_time_pst: "09:30"
    style: >
      Short claims or provocations. Pick the sharpest sentence from the source and
      trim for 280-char energy. No hashtag spam; 0-1 hashtags max.
  linkedin:
    min_reuse_days: 60      # professional audience; avoid feeling repetitive
    max_chars: 3000
    derivative_count: [1, 2]
    best_times_pst: "Tue-Thu, 8-10am. Business hours only; no evenings or weekends."
    posts_per_week: 5      # bumped 2->5 (Muxin, 2026-07-07); spread across the work week
    slot_days: [Mon, Tue, Wed, Thu, Fri]
    slot_time_pst: "08:30"
    style: >
      Lesson post, left-aligned narrative, practitioner voice. Insight-driven,
      not link-dump. Short paragraphs, line breaks between thoughts.
  bluesky:
    min_reuse_days: 21
    max_chars: 300
    derivative_count: [2, 4]
    best_times_pst: "Daily 9-11am and 6-9pm. Evenings are lively for the AI/tech crowd, weekends included."
    posts_per_week: 7
    slot_days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]   # tech/AI crowd is active on weekends → true daily
    slot_time_pst: "18:30"
    style: >
      Like X but slightly more casual and observational. Civic/tech audience,
      less algorithmic pressure.
  community:
    max_chars: 1500
    derivative_count: [1, 1]
    style: >
      Conversational, specific to the community (see communities below). Shorter than
      LinkedIn. Reads like a member sharing, never like marketing.
  video-script:
    max_words: 220        # ~60-90s at normal speaking pace
    style: >
      Hook in first line, 1-2 main points, call to action. Direct, thoughtful,
      not hype-y. Written to be spoken aloud.
  quote-card:
    min_reuse_days: 30
    max_chars: 180
    # Card cadence for the unified scheduler (publish:cards). A card fans out to several platforms
    # at once, so it gets its own midday weekday window; it also de-conflicts against (and counts
    # toward) each target platform's cap, so a card series never pushes e.g. LinkedIn past its 2/wk.
    posts_per_week: 7
    slot_days: [Mon, Tue, Wed, Thu, Fri]
    slot_time_pst: "12:00"
    style: One or two quotable lines pulled verbatim from the source.
  tiktok:
    min_reuse_days: 14      # short-form video; faster cadence, consistent with x=14
    # TikTok video cadence for the unified scheduler (publish:tiktok), so the short shares the one
    # ledger as text + cards and never lands a PT day another TikTok post already took. Usually 1
    # short/piece, so the weekly cap is mostly headroom. TIKTOK_SCHEDULE_AT overrides for a one-off;
    # with no entry here it falls back to TIKTOK_SCHEDULE_LEAD_MIN.
    posts_per_week: 3
    slot_days: [Tue, Wed, Thu, Fri]
    slot_time_pst: "17:00"
  youtube:
    min_reuse_days: 30      # long-form/video cadence; same floor as quote-card
    # YouTube Shorts cadence for the unified scheduler (publish:youtube). The short is uploaded as a
    # SCHEDULED publish (status.publishAt = the claimed slot, private until then) so it auto-goes
    # public on the same clock as text/cards/TikTok. The same render also feeds TikTok under a
    # separate platform key, so the two can share a calendar day. Remove these three fields to revert
    # to a plain private upload (manual flip in Studio).
    posts_per_week: 3
    slot_days: [Tue, Wed, Thu, Fri]
    slot_time_pst: "16:00"

communities:
  moral-ambition:
    notes: Broad community on moral ambition as a life philosophy. Civic and social good angle.
  democratic-resilience:
    notes: >
      Subgroup inside Moral Ambition focused on U.S. democracy, elections, civic action.
      Strongest traction for the voting tool. Be specific and action-oriented here.
  women-in-product:
    notes: Technical builder POV, AI-native product work. Professional credibility angle.
  abc-builders:
    notes: AI builder community. Presence not yet established — observe before posting heavily.
  lennys:
    notes: Product strategy, growth. Selective and occasional engagement only.

# Home-brand worldview line (Muxin, 2026-07-04). The thread-check (src/atomize/thread-check.ts,
# run inline during /atomize step 5.5) judges whether a piece connects back to this line before it
# reaches review-queue.md. The test is NOT "is this about AI" — it's whether the piece touches one
# of the `signals` below. On a "missing" verdict, Spin (the same per-channel reframing below) weaves
# `worldview_expanded` in — reusing this approved language, never inventing new claims. Surface/
# suggest only: a missing or failing check never blocks a piece from being queued or published.
home_brand:
  worldview: >-
    I uncover harmful hidden beliefs and why they need to change before AI automates everything.
  worldview_expanded: >-
    The real AI risk isn't the machine, it's the unexamined human systems we're about to automate
    at full speed. I ship software as the proof.
  signals:
    - an unexamined human system, assumption, incentive, or norm
    - who actually benefits or is harmed by an existing system, process, or institution
    - a hidden belief that needs to change before it gets automated at scale
    - building/shipping the right thing, not just automating the wrong one faster

# Spin angles (Muxin, approved 2026-06-30; promoted to always-on default 2026-07-02 — see
# docs/spin-experiment.md and .claude/skills/atomize/references/spin-mode.md). Internal generation
# config ONLY: these guide how /atomize reframes a platform derivative from the source essay. They
# are never published verbatim as post copy — the post text must still trace back to something
# Muxin actually wrote. `substack` is reserved: Substack is the source channel, not an atomize
# output target (config/routing.yaml), so its angle isn't applied to any derivative today.
spin_angles:
  x:
    audience: tech
    angle: >-
      Voice of the non-engineer OUTSIDE the SV tech bubble — what these AI tools are actually like
      for the 96% of non-tech workers, and how the hidden assumptions baked in by that bubble
      misfire for and harm them.
  linkedin:
    audience: business/career
    angle: >-
      Critiques business innovation broadly (NOT just product craft) — how corporate / business
      norms quietly strangle the creative innovation they claim to want.
  substack:
    audience: society
    angle: >-
      Builder-philosopher: the real AI risk is not the machine, it is the unexamined human systems
      we are about to automate at full speed.
  bluesky:
    audience: political
    angle: >-
      The PM who treats democracy as broken UX + AI as making the fairness gap unignorable.
