# Editorial layer for the content router (src/strategy/route.ts).
# Data (resonance) decides which platforms get a piece when there is enough of it;
# this file fills cold-start gaps and encodes rules the data can't see yet.
#
# Routing targets are derivative platforms only: x, linkedin, bluesky, mastodon, threads, and
# community:<id> (see config/platforms.yaml communities), for full essays/posts. Substack
# is both a SOURCE channel (analytics pull) and, for Substack Notes specifically, an
# atomize routing TARGET (via the /atomize notes flow -> src/publish/substack.ts) — full
# essays/posts are still never routed to Substack; Muxin writes and publishes those
# directly. quote-card is a format asset — see thresholds.always_consider; it is never
# platform-gated. (Video scripts moved to the /video skill — atomize no longer generates
# them, so video-script is not routed here.)
#
# Mastodon and Threads (Muxin, 2026-08-20): zero data yet, so every pillar defaults to
# broad inclusion (cold-start convention, see the conventions note in root CLAUDE.md).
# Narrow this to a pillar fit once posts accumulate and route.ts's data-driven scoring
# has something to work with.

defaults:                 # platforms to include per pillar while data is INSUFFICIENT (cold start)
  human-ai:    [linkedin, bluesky, mastodon, threads]
  claude-code: [x, linkedin, bluesky, mastodon, threads]
  civic-tech:  [bluesky, mastodon, threads, community:democratic-resilience]
  career-work: [linkedin, mastodon, threads]   # LinkedIn-led: it's the top-engaging theme there.
  builder:     [x, linkedin, mastodon, threads]   # build-in-public lands on LinkedIn; PM craft does well on X.
  other:       [mastodon, threads]

rules:                    # hard overrides applied AFTER the data decision
  # X policy, 2026-09-07: "I'd stop doing career-work on X. ONLY technical stuff goes on X cause that's the only thing that platform seems to respect these days."
  # Think very silicon valley monoculture, if it fits that paradigm, it can go in X.
  human-ai:
    never: [x]
  civic-tech:
    always: [community:democratic-resilience]   # voting tool's strongest room — always route here
    never: [x]
  career-work:
    never: [x]
  other:
    never: [x]
  # claude-code:
  #   never: [community:lennys]                  # example: never auto-route claude-code there

thresholds:
  min_posts_for_data: 3   # n below this (for a pillar on a platform) → treat as cold start
  skip_below_score: 0.4   # normalized fit (0..1) under which a platform is skipped
  always_consider: [quote-card]  # format asset, always generated, never gated (video → /video skill)
