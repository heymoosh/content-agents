# Pattern mining, phase 1 config.
#
# Muxin edits this file freely. It is the editable list of who and what the corpus collects, and
# the bars a post has to clear before it counts as an outlier worth studying.
#
# The collected corpus itself (data/patterns/) is gitignored. Other creators' full post text and
# transcripts never reach git. Only the distilled patterns get committed.

# The three niches already covered by .claude/skills/atomize/references/hook-patterns.md, plus a
# fourth added 2026-08-22.
#
# virality-growth is Muxin's call, in her words: "I wouldn't limit it to my niche either, civic
# topics are notoriously bad as a market, so I'd also want us to focus on accounts that teach you
# how to go viral as well since human psychology is more universal and can be applied across
# domains." It may end up the most valuable niche here.
#
# What belongs in it: creators who TEACH audience growth, hooks, retention and short-form craft.
# What does not: creators who merely happen to be big inside a topic. Being large is not the
# qualification, teaching the mechanics is.
niches:
  - building-solopreneur
  - inner-journey
  - civic-democracy
  - virality-growth

