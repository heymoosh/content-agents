# Content-type -> CTA routing (Smarter routing, card 6dcaee98). No more one CTA per pillar --
# /atomize classifies each derivative by CONTENT TYPE (which of the 8 types below fit, possibly
# more than one) instead of by pillar, and src/publish/cta.ts resolves the CTA(s) at PUBLISH time.
#
# Each type has a documented `primary` (the main ask) and, for most types, a `secondary` (the
# follow-up) -- verbatim from the card's table. `secondary` is optional: project_demo and
# offer_adjacent_post carry only one entry.
#
# Two destinations only:
#   - `source`  -- the essay/Substack link. Resolves like any other CTA (the essay's own
#     canonical_url, falling back to source_fallback in cta.yaml).
#   - `project` -- a PER-POST url, supplied at atomize time as that derivative's own `project_url`
#     frontmatter field (see .claude/skills/atomize/SKILL.md step 4.5). There is no config-level
#     project url and no "live" flag -- a project link varies per post (which project a given essay
#     references), so it can't live here. If a derivative has no project_url, that CTA entry is
#     simply dropped from the resolved output, never substituted with the essay link instead.
#
# "Work with me" is OUT of scope for this release (Muxin, 2026-07-08) -- not deferred-and-hidden,
# removed as a config option entirely. It comes back via backlog card ae602c84 ("Smarter routing --
# restore 'work with me' CTA once a real destination exists"), which depends on the "Landing page"
# card (87c86b16) and will restore project_demo's dropped secondary, offer_adjacent_post's dropped
# primary, and case_study's full "See projects / work with me" wording once a real work-with-me url
# exists.

types:
  essay_excerpt:
    primary:
      text: "Read full essay on Substack"
      destination: source
    secondary:
      text: "See related project"
      destination: project

  society_capitalism_piece:
    primary:
      text: "Subscribe/read more"
      destination: source
    secondary:
      text: "Optional: explore projects"
      destination: project

  ai_agency_thesis:
    primary:
      text: "Read full essay"
      destination: source
    secondary:
      text: "See what I'm building"
      destination: project

  personal_career_reflection:
    primary:
      text: "Subscribe/follow"
      destination: source
    secondary:
      text: "Maybe: see my job-search project"
      destination: project

  product_builder_insight:
    primary:
      text: "See how I think/work"
      destination: project
    secondary:
      text: "Read related essay"
      destination: source

  project_demo:
    primary:
      text: "Explore the project"
      destination: project
    # no secondary -- the old "Work with me" secondary is removed per Muxin's feedback, not replaced

  offer_adjacent_post:
    primary:
      text: "Read my thinking"
      destination: source
    # the old primary ("Work with me / landing page") is removed entirely; what was the secondary
    # ("Read my thinking") is now this type's only entry

  case_study:
    primary:
      text: "See projects"
      destination: project
    secondary:
      text: "Read the essay behind it"
      destination: source
