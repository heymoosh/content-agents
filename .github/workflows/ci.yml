name: CI

on:
  # Ordinary lint/typecheck/unit verification is the local merge gate. Keep a
  # manual escape hatch for an independent hosted run without spending an
  # Actions runner on every PR and push.
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
