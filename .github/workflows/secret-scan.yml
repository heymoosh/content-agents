name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Secret scanning "on by default (free)" applies to every exposure class per
# docs/maintenance-loops.md (simple-kanban) invariant 2 -- this repo holds
# real third-party API keys/OAuth secrets (.env.example) even though it's
# Class A (local tool, no deploy, no external users). It's private, so
# GitHub's native secret scanning needs GitHub Advanced Security (paid).
# This runs the open-source gitleaks CLI directly from its published Docker
# image instead of the gitleaks-action wrapper, which requires a paid
# license for private-repo use -- same detection engine, no license needed.
#
# Unlike dependency-audit.yml (advisory, schedule-only), this fails the job
# hard on a real finding: a leaked secret isn't informational. Runs on every
# push/PR since secret leaks are an every-commit risk, not a calendar one
# (event-driven per invariant 3). Not wired as a required status check --
# that's a branch-protection setting for Muxin to opt into if wanted.
jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned to a release tag, not :latest. A floating tag on the image that
      # scans this repo's full history is a supply-chain surface: whoever
      # publishes :latest next gets to run arbitrary code over the checkout.
      # Bump deliberately. ghcr.io/gitleaks is the project's current home; the
      # old zricethezav/* Docker Hub path is no longer where releases land.
      - name: Run gitleaks (OSS CLI via Docker, no license required)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --exit-code 1
