# Runtime rules input for Build 3 (Venture) phase scripts. venture/rules.md is the prose
# authority and does NOT execute -- a phase script loads ONLY this file. src/venture/rules.ts
# validates this file's rules_version against what's stamped in a venture's canon.md at kickoff.
#
# Phase 1, Phase 2, Phase 3, and Phase 4's data-model sections (daily_operating_plan,
# day_14_decision, cta_policy_by_phase["4"], phase4_completion) are now encoded. Phase 4's
# artifact_kinds rows (daily-operating-plan, day-14-review, thank-you-note) are deliberately still
# NOT encoded here -- that is Work Package 1/2's job, when phase4.ts actually drafts those
# artifacts; artifactKindRule() refuses them loudly in the meantime rather than returning a made-up
# rule (see rules.test.ts's "throws on an unknown artifact kind" case). Partial coverage is
# deliberate and visible, never silent (see the parity test, src/venture/rules.test.ts).

rules_version: venture-rules-2026-08-19-draft-1

sources:
  starter_kit_sha256: "773250cefd3ec8a8dfd86b1f6247f9005dd1f1bda47a0c5171a6f6236722ecc6"
  welsh_note_sha256: "bad486c48b8477a9ae3c92fae3cd1c40dded1dc6cda483a5f297ddbb6da81df3"

# venture-schema-contract.md §3's artifact-kind table -- Phase 1, Phase 2, and Phase 3 rows now
# encoded. The remaining kind (thank-you-note -- Phase 4) is # not yet encoded -- see
# venture-schema-contract.md §3 in full.
artifact_kinds:
  substack-post:
    delivery_mode: manual # ready-to-paste/, Muxin pastes it herself
    publishable: false
    min_evidence: url
    phase: 1
  text-post-note:
    delivery_mode: app # the existing Substack Notes browser agent, via the shared scheduler
    publishable: true
    min_evidence: agent
    phase: 1
  phase_1_research_plan:
    delivery_mode: none # internal artifact; gates drafting via reviewed_by_muxin
    publishable: false
    min_evidence: null
    phase: 1
  phase_1_research_read:
    delivery_mode: none # internal artifact; required before Phase 2 concept generation (rules.md §5.6)
    publishable: false
    min_evidence: null
    phase: 1
  lead-magnet:
    delivery_mode: manual # published/hosted wherever it is downloadable; Muxin installs it herself
    publishable: false
    min_evidence: url
    phase: 2
  landing-page-copy:
    delivery_mode: manual # copy/outline only -- Muxin installs it on humaninference.ai herself
    publishable: false
    min_evidence: url
    phase: 2
  welcome-email:
    delivery_mode: manual # copy only -- Muxin installs it in her email tool herself
    publishable: false
    min_evidence: attestation
    phase: 2
  survey:
    # A fit review of Muxin's existing live survey against the chosen lead magnet, not a new
    # survey authored from scratch (rules.md §6.5, amended 2026-08-19; see
    # venture/existing-survey-humaninference.md).
    delivery_mode: manual
    publishable: false
    min_evidence: url
    phase: 2
  text-post-announcement:
    # venture-schema-contract.md §3 actually states delivery_mode as "manual or app, per its
    # channel" -- the announcement ships as whichever of substack-post/text-post-note the chosen
    # platform item uses, decided per post. This static table takes the more conservative
    # "manual" default; per-item delivery-mode selection is phase2.ts's job, a separate work
    # package from this one.
    delivery_mode: manual
    publishable: false
    min_evidence: url
    phase: 2
  product-outline:
    delivery_mode: none # internal decision artifact -- no external delivery step to confirm
    publishable: false
    min_evidence: null
    phase: 3
  price-decision:
    delivery_mode: none # internal decision artifact -- no external delivery step to confirm
    publishable: false
    min_evidence: null
    phase: 3

# rules.md §5.1 -- the platform-recommendation decision. Single primary platform only; the
# system MUST NOT recommend a multi-platform launch.
platform_recommendation:
  filters: [audience_attention, format_sustainability, burnout_risk]
  single_primary_platform: true

# rules.md §5.1A -- the research-plan gate that must clear before any idea is drafted.
research_plan:
  unknown_dimensions: [emotional_frame, desired_help, audience_segment, other]
  # confirmed_knowns[] entries need BOTH evidence_refs and confirmed_by_muxin to count -- an
  # AI-asserted "already known" with no citation and no confirmation never excuses skipping a probe.
  require_confirmed_by_muxin: true

# rules.md §5.2 -- ten ideas, four factors, three selected.
idea_ranking:
  idea_count: 10
  factors: [personal_stake, specificity, identity_signal, easy_reply]
  score_scale: { min: 1, max: 5 }
  select_count: 3
  bank_remainder: true # the other 7 stay in the decision record, never deleted
  # distinct-unknown coverage (rules.md §5.2): a decision-record rationale is required when 2+ of
  # the 3 selected ideas share an unknown_id -- enforced in src/venture/decisions.ts, not just here.
  require_rationale_on_unknown_overlap: true

# rules.md §5.3 -- draft constraints, checked by src/venture/phase1.ts before a draft is
# presented for approval. Order to draft in: body, then CTA/reply-bridge, then hook last (§3.1).
draft:
  post_max_words: 150
  require_reply_prompt: true # §1A.1: "no CTA" needs a recorded exception, never a default
  require_claim_refs: true # every concrete factual claim traces to intake:qN or a confirmed_known

# rules.md §1A.1 -- CTA policy by phase.
cta_policy_by_phase:
  1: reply_prompt
  2: lead_magnet_bridge # "Bridge to the relevant active lead magnet."
  # "Normally the lead magnet or a response request." An offer is allowed only after the response
  # gate opens AND the Phase 3 decisions/artifacts in checkpoint-3 are approved (§7.10) -- that
  # conditional escalation is a phase3.ts CTA-selection concern (a later work package), not a
  # second static value here.
  3: lead_magnet_or_response_request
  # §1A.1's Phase 4 row is a SET of allowed values, not one default: "the relevant lead magnet, an
  # approved offer, a project, or no CTA, chosen by the item's actual purpose." Unlike phases 1-3,
  # a later work package's phase4.ts picks one of these four per item -- this list is the allowed
  # set, not a recommendation.
  4: [lead_magnet_bridge, approved_offer, project, no_cta]

# rules.md §5.4-§5.5 -- publish pace and Checkpoint 1's three-part predicate.
phase_1_pace:
  recommended_posts_per_week: 5 # a recommendation, not a hard requirement -- Muxin records her own
checkpoints:
  checkpoint-1:
    required_artifact_count: 3
    require_all_live: true # Muxin, 2026-08-18 -- no partial pass
    require_pace_recorded: true
  checkpoint-2:
    required_artifact_kinds: [lead-magnet, landing-page-copy, welcome-email, survey]
    require_all_live: true # rules.md §6.8 -- the announcement is explicitly NOT required to clear
  checkpoint-3:
    # venture-schema-contract.md §5.3 names the real ledger event `<slug>/phase-3-completed`
    # (matching rules.md §7.10's "Record `phase_3_completed`"), distinct from the generic
    # `<slug>/checkpoint-<n>` pattern checkpoint-1/checkpoint-2 use -- resolved (Work Package 3) via
    # `ledger_event_id` below, which src/venture/checkpoint.ts and state.ts both read instead of
    # assuming `<slug>/checkpoint-3`. The response gate opening (§7.3) is explicitly NOT part of
    # this predicate -- it is a separate ledger event that only unlocks the identify-problem/
    # outline-product/set-price gated actions (§5.3), out of scope for this checkpoint.
    required_artifact_kinds: [product-outline, price-decision]
    require_all_live: true # approved+not_applicable counts as live for delivery_mode: none kinds
    ledger_event_id: phase-3-completed
    # The problem, transformation, and price/pitch decisions must each be `selected` (rules.md
    # §7.10; venture-schema-contract.md §5.3) before this checkpoint clears, alongside the two
    # artifacts above. Read by state.ts's checkpointArtifactState (Work Package 3) -- see
    # CheckpointRule.required_decision_kinds' comment in src/venture/rules.ts.
    required_decision_kinds: [problem-selection, transformation-choice, product-format-and-price]

# rules.md §8.5/§8.6, venture-schema-contract.md §5.3 -- Phase 4 ends with the Day 14 review's
# human decision, not a fourth checkpoint ("There is no checkpoint-4"). A SIBLING key to
# `checkpoints`, deliberately never a key inside it -- see Phase4CompletionRule's comment in
# src/venture/rules.ts. `thank-you-note` is deliberately excluded from
# required_artifact_kinds: rules.md §8.4 sets no minimum count for thank-you notes, so they never
# block Phase 4 completion.
phase4_completion:
  required_artifact_kinds: [daily-operating-plan, day-14-review]
  required_decision_kinds: [daily-operating-plan-choice, day-14-decision]
  ledger_event_id: phase-4-completed

# rules.md §6.2 -- five lead-magnet concepts, six factors, Muxin selects (or overrides) one.
lead_magnet_concept:
  concept_count: 5
  factors: [early_problem, narrowness, frustration, fast_win, proof_fit, research_value]
  score_scale: { min: 1, max: 5 }
  select_count: 1

# rules.md §5.6 -- the phase-1-research-continuation decision that gates Phase 2 concept
# generation (venture-schema-contract.md §2A).
research_continuation:
  candidates: [more_probes, proceed_with_evidence, proceed_as_hypothesis]

# rules.md §5.6 / venture-schema-contract.md §2C.3-§2C.4 -- phase_1_research_read's required
# evidence-channel coverage and its per-finding signal-quality rubric.
research_read:
  required_sources: [note_reply, essay_comment, metric, subscriber_movement, dm, email, follow_up_question, creator_observation]
  signal_quality_factors: [audience_fit, specificity, explicit_stuck_point, requested_help, follow_up_question, recurrence, behavioral_action, exposure_context]

# rules.md §7.3 -- the response gate's eligible-unique-respondent thresholds. Posting continues
# and the survey keeps collecting below the minimum; the gate unlocks analysis only, never Phase 4
# (§7.3, §7.10, venture-schema-contract.md §5.3). The response log itself (respondent hashing,
# dedup, eligibility) is Work Package 1's src/venture/responses.ts, not this file.
response_gate:
  min_eligible_unique: 20
  target_eligible_unique: 30

# rules.md §7.6 -- score every cluster 1-5 on these six factors to find the expensive problem.
problem_score:
  factors: [frequency, intensity, time_cost, money_cost, stress_cost, solvability]
  score_scale: { min: 1, max: 5 }

# rules.md §7.8 -- the product outline built backwards from the approved transformation.
product_outline:
  min_sections: 5
  max_sections: 7

# rules.md §7.5 -- "three to five clusters, not a long list of micro-categories."
cluster_analysis:
  min_clusters: 3
  max_clusters: 5

# rules.md §7.7 -- the three vague verbs rules.md's prose names by example ("such as 'unlock,'
# 'elevate,' or 'transform'") as banned from the transformation sentence's user-facing copy. This
# is a mechanical substring check (same shape as the em-dash check), so it also catches a
# derivative like "unlocking"/"elevated"/"transformation" -- deliberately, since those read as the
# same vague jargon rules.md is naming.
transformation:
  banned_verbs: [unlock, elevate, transform]

# rules.md §8.1 -- the PDF's canonical five-job daily routine (2h15m total) and the four
# recorded-choice modes offered when the intake time budget doesn't fit it. canonical_total_minutes
# is checked against the sum of canonical_jobs[].minutes in rules.test.ts, so the two can never
# silently drift apart.
daily_operating_plan:
  canonical_jobs:
    - { label: "content writing and engagement", minutes: 30 }
    - { label: "tomorrow's posts", minutes: 30 }
    - { label: "feedback analysis", minutes: 30 }
    - { label: "the core offer", minutes: 30 }
    - { label: "direct customer outreach", minutes: 15 }
  canonical_total_minutes: 135
  # venture-schema-contract.md §2B's `daily-operating-plan.fields.chosen_mode` enum, matching
  # rules.md §8.1's four numbered choices in order: use the canonical routine; rotate the five jobs
  # across the week; extend the build timeline; revise the posting pace or scope.
  modes: [canonical, rotated, extended_timeline, revised_scope]

# rules.md §8.5 -- the Day 14 review's final decision. Candidates match
# src/venture/intake.ts's SCORECARD_FIXED.final_decision_options exactly (parity-tested in
# rules.test.ts, imported rather than hand-copied); the system never recommends one.
day_14_decision:
  candidates: [continue, revise_positioning, revise_lead_magnet, collect_more_evidence, stop]

# not yet encoded -- see venture-schema-contract.md §5.4/§5.6/§5.7/§5.8 (responses, evidence links,
# funnel events, Signals mapping), plus the Phase 3 response-gate ledger event and checkpoint-3's
# required_decision_kinds wiring into checkpoint.ts/state.ts (Work Packages 1 and 3), and Phase 4's
# own artifact-drafting logic (phase4.ts, a later work package). None of it is needed until a later
# slice.
